<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0b10">
<meta name="description" content="PeachFlix — movies & series streaming">
<title>PeachFlix</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark;--bg:#0a0b10;--bg2:#12141d;--card:#171a25;--line:#242838;--text:#eef0f6;--muted:#9aa2b5;--accent:#ff8359;--accent2:#ff5e7e;--gold:#ffc857;--radius:14px;--header-h:58px;--tab-h:60px;--shadow:0 10px 30px rgba(0,0,0,.45)}
html{background:var(--bg)}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Ubuntu,"Helvetica Neue",Arial,sans-serif;line-height:1.55;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit;color:var(--text);background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;outline:0;width:100%}
input:focus,select:focus{border-color:var(--accent)}
img{display:block;max-width:100%}
::-webkit-scrollbar{height:8px;width:8px}
::-webkit-scrollbar-thumb{background:#2a2f42;border-radius:4px}
.muted{color:var(--muted)}
/* ---------- header / tab bar ---------- */
#topbar{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;gap:14px;height:var(--header-h);padding:0 18px;background:rgba(10,11,16,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.06)}
.logo{font-weight:800;font-size:19px;letter-spacing:.3px;background:linear-gradient(120deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
.nav{display:flex;gap:4px;margin-left:6px}
.nav a{padding:7px 13px;border-radius:999px;color:var(--muted);font-size:14px;font-weight:600}
.nav a:hover{color:var(--text)}
.nav a.active{color:var(--text);background:rgba(255,255,255,.08)}
.spacer{flex:1}
.iconbtn{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;color:var(--muted)}
.iconbtn:hover{color:var(--text);background:rgba(255,255,255,.08)}
.iconbtn svg{width:20px;height:20px}
main{padding-top:var(--header-h);padding-bottom:calc(var(--tab-h) + 18px);min-height:100vh}
#tabbar{position:fixed;bottom:0;left:0;right:0;z-index:50;display:flex;height:var(--tab-h);background:rgba(10,11,16,.88);backdrop-filter:blur(14px);border-top:1px solid rgba(255,255,255,.06);padding-bottom:env(safe-area-inset-bottom)}
#tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:10.5px;font-weight:600}
#tabbar a svg{width:22px;height:22px}
#tabbar a.active{color:var(--accent)}
@media(min-width:900px){#tabbar{display:none}}
@media(max-width:899px){.nav{display:none}input,select{font-size:16px}}
/* ---------- hero ---------- */
.hero{position:relative;height:min(78vh,640px);min-height:440px;display:flex;align-items:flex-end;overflow:hidden;background:var(--bg2)}
.hero-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .55s}
.hero-fade{position:absolute;inset:0;background:linear-gradient(to top,var(--bg) 4%,rgba(10,11,16,.75) 34%,rgba(10,11,16,.12) 70%)}
.hero-body{position:relative;padding:0 20px 30px;max-width:640px}
.hero-badge{display:inline-block;font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.hero h1{font-size:clamp(26px,6vw,46px);line-height:1.12;font-weight:800;text-shadow:0 2px 18px rgba(0,0,0,.5)}
.hero-meta{color:var(--muted);font-size:14px;margin:8px 0 10px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.star{color:var(--gold);font-weight:700}
.hero-ov{color:#cfd4e2;font-size:14px;max-width:54ch;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:16px}
.hero-dots{position:absolute;right:20px;bottom:14px;display:flex;gap:6px}
.hero-dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.28);cursor:pointer;transition:.2s}
.hero-dots i.on{background:var(--accent);width:18px;border-radius:4px}
/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;border-radius:12px;font-weight:700;font-size:14px;border:1px solid transparent;transition:transform .15s,background .2s}
.btn:active{transform:scale(.96)}
.btn.primary{background:linear-gradient(120deg,var(--accent),var(--accent2));color:#16100c;box-shadow:0 6px 22px rgba(255,110,90,.35)}
.btn.ghost{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.14)}
.btn.ghost:hover{background:rgba(255,255,255,.16)}
.btn.sm{padding:8px 13px;font-size:13px;border-radius:10px}
.btn.on{background:rgba(255,131,89,.16);border-color:var(--accent);color:var(--accent)}
.danger{color:#ff7b7b}
/* ---------- rows & cards ---------- */
.row{margin:24px 0}
.row h2{font-size:17px;font-weight:700;padding:0 20px;margin-bottom:12px}
.row-scroll{display:flex;gap:12px;overflow-x:auto;padding:2px 20px 6px;scroll-snap-type:x proximity;scrollbar-width:none}
.row-scroll::-webkit-scrollbar{display:none}
.card{position:relative;width:130px;flex:0 0 auto;scroll-snap-align:start}
.card-img{position:relative;aspect-ratio:2/3;border-radius:var(--radius);overflow:hidden;background:var(--card);box-shadow:0 4px 16px rgba(0,0,0,.35)}
.card:hover .card-img img{transform:scale(1.06)}
.card-img img{width:100%;height:100%;object-fit:cover;transition:transform .35s}
.card-img.round{aspect-ratio:1;border-radius:50%}
.score{position:absolute;bottom:7px;left:7px;background:rgba(8,9,14,.78);padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;color:var(--gold)}
.noimg{width:100%;height:100%;display:grid;place-items:center;font-size:30px;color:#333a4e;background:linear-gradient(160deg,#1a1e2b,#12141d)}
.card-t{font-size:13px;font-weight:600;margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-s{font-size:12px;color:var(--muted)}
.card-x,.cwclose{position:absolute;top:7px;right:7px;z-index:3;width:26px;height:26px;border-radius:50%;background:rgba(8,9,14,.8);color:#fff;font-size:12px;display:none;place-items:center}
.card:hover .card-x,.card:hover .cwclose{display:grid}
@media(hover:none){.card-x,.cwclose{display:grid;opacity:.6}}
.cwbar{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.25)}
.cwbar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.playbadge{position:absolute;inset:0;display:grid;place-items:center;font-size:26px;color:#fff;background:rgba(0,0,0,.18);opacity:0;transition:.2s}
.card:hover .playbadge{opacity:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:18px 12px;padding:0 20px}
.grid .card{width:auto}
/* ---------- chips / filters ---------- */
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 20px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:7px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--muted);font-size:13px;font-weight:600}
.chip.on{background:linear-gradient(120deg,var(--accent),var(--accent2));color:#16100c;border-color:transparent}
.filters{display:flex;gap:10px;flex-wrap:wrap;padding:0 20px;margin:6px 0 16px}
.filters select{width:auto;min-width:128px;color:var(--muted);font-size:13px}
/* ---------- pages ---------- */
.page-h{padding:22px 20px 8px;font-size:clamp(22px,5vw,30px);font-weight:800}
.sub-h{padding:0 20px;color:var(--muted);font-size:14px}
.seg{display:flex;gap:6px;padding:10px 20px 14px;flex-wrap:wrap}
.seg button{padding:8px 15px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--muted);font-weight:600;font-size:13px}
.seg button.on{background:linear-gradient(120deg,var(--accent),var(--accent2));color:#16100c;border-color:transparent}
.search-wrap{padding:18px 20px 6px}
.foot{padding:44px 20px 10px;color:#565d72;font-size:12px;text-align:center}
.errbox{padding:60px 20px;text-align:center;display:grid;gap:8px;justify-items:center}
.mrow{display:flex;gap:10px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
/* ---------- detail ---------- */
.d-hero{position:relative;height:min(52vh,460px);min-height:300px;overflow:hidden;background:var(--bg2)}
.d-hero img{width:100%;height:100%;object-fit:cover;object-position:top}
.d-fade{position:absolute;inset:0;background:linear-gradient(to top,var(--bg) 2%,rgba(10,11,16,.72) 40%,rgba(10,11,16,.1))}
.d-head{display:flex;gap:18px;padding:0 20px;margin-top:-110px;position:relative;flex-wrap:wrap}
.d-poster{width:150px;border-radius:var(--radius);box-shadow:var(--shadow);flex:0 0 auto}
@media(max-width:600px){.d-poster{width:110px}}
.d-info{flex:1;min-width:240px;padding-top:90px}
.d-meta{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:14px;margin:8px 0 12px;align-items:center}
.tag{padding:3px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:12px;color:var(--muted)}
.d-btns{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}
.d-ov{padding:0 20px;color:#c8cede;max-width:80ch;margin:14px 0}
.cast{width:104px;flex:0 0 auto;text-align:center}
.cast img,.cast .noimg{width:104px;height:104px;object-fit:cover;border-radius:50%;background:var(--card);margin:0 auto 7px;font-size:26px;display:grid;place-items:center}
.cast .nm{font-size:13px;font-weight:600}
.cast .ch{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.banner{display:flex;align-items:center;gap:12px;margin:10px 20px;padding:14px 16px;border-radius:var(--radius);background:linear-gradient(120deg,rgba(255,131,89,.14),rgba(255,94,126,.1));border:1px solid rgba(255,131,89,.3)}
/* ---------- watch ---------- */
.player-wrap{position:sticky;top:var(--header-h);z-index:40;background:#000}
.player-wrap iframe{display:block;width:100%;aspect-ratio:16/9;border:0;max-height:calc(100dvh - var(--header-h));margin:0 auto}
.watch-body{padding:16px 20px 0}
.w-title{font-size:clamp(20px,4vw,28px);font-weight:800}
.w-meta{color:var(--muted);font-size:14px;margin:6px 0 12px}
.eps-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:22px 20px 12px;flex-wrap:wrap}
.eps-head h2{font-size:17px}
.eps-head select{width:auto}
.eps{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;padding:0 20px}
.ep{position:relative;border-radius:12px;overflow:hidden;background:var(--card);border:1px solid var(--line)}
.ep.cur{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.ep img,.ep-noimg{width:100%;aspect-ratio:16/9;object-fit:cover;background:#0d0f16;display:block}
.ep-body{padding:8px 10px 12px}
.ep-n{font-size:12px;color:var(--accent);font-weight:700}
.ep-t{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.epbar{position:absolute;bottom:0;left:0;right:0;height:3px;background:rgba(255,255,255,.18)}
.epbar i{display:block;height:100%;background:var(--accent)}
.epnav{display:flex;gap:10px;padding:14px 20px}
/* ---------- person ---------- */
.p-head{display:flex;gap:18px;padding:22px 20px;align-items:flex-start;flex-wrap:wrap}
.p-head img{width:150px;border-radius:16px;box-shadow:var(--shadow)}
@media(max-width:600px){.p-head img{width:110px}}
.bio-wrap{max-width:75ch}
.bio{color:#c8cede;font-size:14px;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;margin-top:10px}
.bio.open{display:block}
/* ---------- groups / mine ---------- */
.gwrap{padding:6px 20px;display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.gwrap>.btn{justify-self:start}
.gcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.gname{font-weight:700;margin-bottom:2px}
.gposters{display:flex;gap:6px;margin-top:10px}
.gposters img{height:62px;border-radius:6px}
.glist{display:grid;gap:8px;margin:10px 0}
.grow2{display:flex;gap:10px;align-items:center;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:10px;cursor:pointer}
.grow2 input{width:auto}
.gnew{display:flex;gap:8px;margin-top:12px}
/* ---------- settings / onboarding ---------- */
.form{max-width:560px;padding:6px 20px 30px;display:grid;gap:16px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:600}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
.hint a{color:var(--accent)}
.onboard{min-height:calc(100vh - var(--header-h));display:grid;place-items:center;padding:24px}
.onboard-card{max-width:460px;width:100%;display:grid;gap:14px}
.steps{text-align:left;color:var(--muted);font-size:14px;display:grid;gap:10px;background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:18px}
.steps a{color:var(--accent)}
/* ---------- modal / toast / skeleton ---------- */
#toast{position:fixed;left:50%;bottom:calc(var(--tab-h) + 22px);transform:translate(-50%,20px);background:#1d2130;border:1px solid var(--line);padding:11px 18px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:100;box-shadow:var(--shadow);max-width:88vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#modal-root{position:fixed;inset:0;z-index:90;display:none}
#modal-root.open{display:block}
.modal-backdrop{position:absolute;inset:0;background:rgba(4,5,9,.72);backdrop-filter:blur(4px)}
.modal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,460px);max-height:84vh;overflow:auto;background:var(--bg2);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow)}
.modal h3{font-size:17px;margin-bottom:4px}
.trailer iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:12px}
.sk{border-radius:10px;background:linear-gradient(100deg,#141722 30%,#1c2030 50%,#141722 70%);background-size:200% 100%;animation:sh 1.2s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
</style>
</head>
<body>

<header id="topbar">
  <a class="logo" href="#/">🍑 PeachFlix</a>
  <nav class="nav">
    <a href="#/" data-nav="home">Home</a>
    <a href="#/browse/movie" data-nav="movies">Movies</a>
    <a href="#/browse/tv" data-nav="series">Series</a>
    <a href="#/search" data-nav="search">Search</a>
    <a href="#/mine" data-nav="mine">My Stuff</a>
  </nav>
  <div class="spacer"></div>
  <button class="iconbtn" data-action="goto-settings" data-icon="gear" aria-label="Settings"></button>
</header>

<main id="view"></main>

<nav id="tabbar">
  <a href="#/" data-nav="home" data-icon="home"><span>Home</span></a>
  <a href="#/browse/movie" data-nav="movies" data-icon="film"><span>Movies</span></a>
  <a href="#/browse/tv" data-nav="series" data-icon="tv"><span>Series</span></a>
  <a href="#/search" data-nav="search" data-icon="search"><span>Search</span></a>
  <a href="#/mine" data-nav="mine" data-icon="heart"><span>My Stuff</span></a>
</nav>

<div id="modal-root"></div>
<div id="toast" role="status"></div>

<script>
(function(){
'use strict';

/* ============================ helpers ============================ */
const $=s=>document.querySelector(s);
const view=$('#view');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const debounce=(fn,ms)=>{let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms)}};
function el(html){const t=document.createElement('template');t.innerHTML=html.trim();return t.content.firstElementChild}
function commit(node){view.replaceChildren(node)}
let cleanup=null,routeId=0;

/* ============================ icons ============================ */
const ICONS={
 home:'<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.7V21h5v-6h4v6h5V9.7"/>',
 film:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 5v14M17 5v14M3 9.5h4M3 14.5h4M17 9.5h4M17 14.5h4"/>',
 tv:'<rect x="3" y="6" width="18" height="11" rx="2"/><path d="M8 21h8M12 17v4"/>',
 search:'<circle cx="11" cy="11" r="7"/><path d="M16.5 16.5 21 21"/>',
 heart:'<path d="M20.8 4.6a5.5 5.5 0 00-7.8 0L12 5.6l-1-1a5.5 5.5 0 00-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 000-7.8z"/>',
 gear:'<path d="M4 6h16M4 12h16M4 18h16"/><circle cx="9" cy="6" r="2"/><circle cx="16" cy="12" r="2"/><circle cx="7" cy="18" r="2"/>'};
const icon=n=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]}</svg>`;
document.querySelectorAll('[data-icon]').forEach(x=>x.insertAdjacentHTML('afterbegin',icon(x.dataset.icon)));

/* ============================ storage ============================ */
const DB={
  get(k,f){try{const v=JSON.parse(localStorage.getItem(k));return v==null?f:v}catch{return f}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}
};
const Settings={
  get(){return{tmdbKey:'',dub:'',sub:'',quality:'',server:'',accent:'#ff8359',lang:'en-US',...DB.get('pf_settings',{})}},
  set(patch){const s={...this.get(),...patch};DB.set('pf_settings',s);if(patch.accent)applyAccent(s.accent);return s}
};
function applyAccent(hex){if(!hex)return;document.documentElement.style.setProperty('--accent',hex);document.documentElement.style.setProperty('--accent2',hex)}

function makeListStore(key){
  return{
    key,
    list(){return DB.get(key,[])},
    has(type,id){return this.list().some(i=>String(i.id)===String(id)&&i.type===type)},
    toggle(item){let l=this.list();if(this.has(item.type,item.id)){DB.set(key,l.filter(i=>!(String(i.id)===String(item.id)&&i.type===item.type)));return false}l.unshift(item);DB.set(key,l);return true},
    remove(type,id){DB.set(key,this.list().filter(i=>!(String(i.id)===String(id)&&i.type===type)))}
  };
}
const Fav=makeListStore('pf_favs'),WL=makeListStore('pf_watchlist');

const Groups={
  KEY:'pf_groups',
  all(){return DB.get(this.KEY,{})},
  save(g){DB.set(this.KEY,g)},
  get(uid){return this.all()[uid]||null},
  create(name){const g=this.all();const uid=Date.now().toString(36)+Math.random().toString(36).slice(2,6);g[uid]={name,created:Date.now(),items:[]};this.save(g);return uid},
  rename(uid,name){const g=this.all();if(g[uid]){g[uid].name=name;this.save(g)}},
  remove(uid){const g=this.all();delete g[uid];this.save(g)},
  toggle(uid,item){const g=this.all();if(!g[uid])return false;const l=g[uid].items;const i=l.findIndex(x=>String(x.id)===String(item.id)&&x.type===item.type);if(i>=0){l.splice(i,1);this.save(g);return false}l.unshift(item);this.save(g);return true},
  removeItem(uid,id,type){const g=this.all();if(!g[uid])return;g[uid].items=g[uid].items.filter(x=>!(String(x.id)===String(id)&&x.type===type));this.save(g)}
};

/* ============================ Peachify progress ============================ */
const PEACHIFY_ORIGIN='https://peachify.top';
const Progress={
  KEY:'peachifyProgress',
  all(){try{return JSON.parse(localStorage.getItem(this.KEY))||{}}catch{return{}}},
  save(m){try{localStorage.setItem(this.KEY,JSON.stringify(m))}catch{}},
  get(id){return this.all()[String(id)]||null},
  remove(id){const m=this.all();delete m[String(id)];this.save(m)},
  clear(){this.save({})},
  merge(payload){
    if(!payload||typeof payload!=='object')return;
    const m=this.all();
    const put=r=>{if(!r||typeof r!=='object'||r.id==null)return;const k=String(r.id);m[k]={...(m[k]||{}),...r,last_updated:r.last_updated||Date.now()}};
    if(payload.id!=null&&payload.progress)put(payload);
    else for(const[k,v]of Object.entries(payload))put({...v,id:v?.id??k});
    this.save(m);
  },
  list(){return Object.values(this.all()).filter(r=>r&&typeof r==='object'&&r.id!=null&&r.progress).sort((a,b)=>(b.last_updated||0)-(a.last_updated||0))}
};
const notFinished=r=>{if(r.type==='tv')return true;const p=r.progress||{};return!(p.duration>0&&(p.watched||0)/p.duration>=0.95)};
function finishOrZero(p){if(!p||!p.duration)return 0;return(p.watched||0)/p.duration>=0.95?0:Math.max(0,Math.floor(p.watched||0))}
function resumeFor(prog,type,season,episode){
  if(!prog||!prog.progress)return 0;
  if(type==='tv'){
    const ep=prog.show_progress?.[`s${season}e${episode}`]?.progress;
    if(ep)return finishOrZero(ep);
    if(String(prog.last_season_watched)===String(season)&&String(prog.last_episode_watched)===String(episode))return finishOrZero(prog.progress);
    return 0;
  }
  return finishOrZero(prog.progress);
}
function watchHref(type,id,prog){
  if(type!=='tv')return`#/watch/movie/${id}`;
  const s=(prog&&+prog.last_season_watched)||1,e=(prog&&+prog.last_episode_watched)||1;
  return`#/watch/tv/${id}/${s}/${e}`;
}
function peachUrl(o){
  const path=o.type==='tv'?`/embed/tv/${o.id}/${o.season}/${o.episode}`:`/embed/movie/${o.id}`;
  const p=new URLSearchParams();
  if(o.dub)p.set('dub',o.dub);if(o.sub)p.set('sub',o.sub);
  if(o.quality)p.set('quality',String(o.quality));
  if(o.server)p.set('server',o.server);
  if(o.startAt>0)p.set('startAt',String(Math.round(o.startAt)));
  if(o.type==='tv'){p.set('autoNext','true');p.set('showNextBtn','true')}
  if(o.accent)p.set('accent',String(o.accent).replace('#',''));
  const qs=p.toString();
  return PEACHIFY_ORIGIN+path+(qs?`?${qs}`:'');
}

/* ============================ TMDB ============================ */
const TMDB={
  base:'https://api.themoviedb.org/3',imgBase:'https://image.tmdb.org/t/p',cache:new Map(),
  img(path,size='w342'){return path?`${this.imgBase}/${size}${path}`:''},
  async get(path,params={}){
    const key=Settings.get().tmdbKey;
    if(!key)throw new Error('Add your TMDB API key in Settings first');
    const u=new URL(this.base+path);
    u.searchParams.set('api_key',key);
    const lang=Settings.get().lang;if(lang)u.searchParams.set('language',lang);
    for(const[k,v]of Object.entries(params))if(v!=null&&v!=='')u.searchParams.set(k,v);
    const us=u.toString();
    if(this.cache.has(us))return this.cache.get(us);
    const r=await fetch(us);
    if(r.status===401)throw new Error('TMDB rejected your API key — check Settings');
    if(!r.ok)throw new Error('TMDB error '+r.status);
    const j=await r.json();this.cache.set(us,j);return j;
  }
};
const tmdb=(p,pr)=>TMDB.get(p,pr);

function renderHero(container,heroes){
  const h=container.querySelector('.hero');if(!h)return;
  if(!heroes.length){h.remove();return}
  h.classList.remove('sk');
  h.innerHTML=`<img class="hero-bg" alt=""><div class="hero-fade"></div>
    <div class="hero-body"><div class="hero-badge"></div><h1></h1><div class="hero-meta"></div><p class="hero-ov"></p><div class="hero-btns"></div></div>
    <div class="hero-dots">${heroes.map((_,i)=>`<i data-i="${i}"></i>`).join('')}</div>`;
  const bg=h.querySelector('.hero-bg'),badge=h.querySelector('.hero-badge'),tEl=h.querySelector('h1'),
        mEl=h.querySelector('.hero-meta'),oEl=h.querySelector('.hero-ov'),bEl=h.querySelector('.hero-btns'),
        dots=h.querySelectorAll('.hero-dots i');
  let idx=0,timer=null;
  const set=i=>{
    idx=i;const x=heroes[i];const type=x.media_type||'movie';
    bg.style.opacity=0;
    setTimeout(()=>{bg.src=TMDB.img(x.backdrop_path,'w1280');bg.onload=()=>{bg.style.opacity=1}},220);
    badge.textContent=`#${i+1} Trending · ${type==='tv'?'Series':'Movie'}`;
    tEl.textContent=x.title||x.name||'';
    mEl.innerHTML=`${x.vote_average?`<span class="star">★ ${x.vote_average.toFixed(1)}</span>`:''}<span>${esc((x.release_date||x.first_air_date||'').slice(0,4))}</span>`;
    oEl.textContent=x.overview||'';
    bEl.innerHTML=`<a class="btn primary" href="${watchHref(type,x.id,Progress.get(x.id))}">▶ Play</a><a class="btn ghost" href="#/${type}/${x.id}">ⓘ More Info</a>`;
    dots.forEach((d,k)=>d.classList.toggle('on',k===i));
  };
  const restart=()=>{clearInterval(timer);timer=setInterval(()=>set((idx+1)%heroes.length),8000)};
  set(0);restart();
  h.querySelector('.hero-dots').addEventListener('click',e=>{const d=e.target.closest('i');if(!d)return;set(+d.dataset.i);restart()});
  cleanup=()=>clearInterval(timer);
}

      <div class="w-meta muted"></div>
      <div class="d-btns" id="w-btns"></div>
      <p class="d-ov" id="w-ov"></p>
    </div>
    <div id="w-eps"></div>
    <div class="rows"></div>
  </div>`);
  commit(c);
  const meta=await tmdb(`/${type}/${id}`);
  const title=meta.title||meta.name||'';
  document.title=`▶ ${title} — PeachFlix`;
  let seasons=[];
  let seasonData=null;
  if(type==='tv'){
    seasons=(meta.seasons||[]).filter(x=>x.season_number>0);
    if(seasons.length&&!seasons.some(x=>x.season_number===season))season=seasons[0].season_number;
    seasonData=await tmdb(`/tv/${id}/season/${season}`).catch(()=>null);
    if(seasonData&&seasonData.episodes){const max=seasonData.episodes.length;if(episode>max)episode=max;if(episode<1)episode=1}
  }
  const startAt=resumeFor(Progress.get(id),type,season,episode);
  c.querySelector('#pf-frame').src=peachUrl({type,id,season,episode,startAt,dub:s.dub,sub:s.sub,quality:s.quality,server:s.server,accent:s.accent});
  const item={id:String(id),type,title,poster:meta.poster_path||'',year:(meta.release_date||meta.first_air_date||'').slice(0,4)};
  const h=c.querySelector('.w-title');h.textContent=title;
  c.querySelector('.w-meta').innerHTML=[item.year,meta.vote_average?`<span class="star">★ ${meta.vote_average.toFixed(1)}</span>`:null,
    type==='movie'&&meta.runtime?`${Math.floor(meta.runtime/60)}h ${meta.runtime%60}m`:null,
    type==='tv'&&seasons.length?`${seasons.length} season${seasons.length===1?'':'s'}`:null].filter(Boolean).map(esc).join(' · ');
  c.querySelector('#w-btns').innerHTML=actionButtons(item,null,{play:false});
  const ovEl=c.querySelector('#w-ov');
  ovEl.textContent=meta.overview||'';ovEl.style.display=meta.overview?'':'none';
  if(type==='tv'&&seasonData){
    const epsEl=c.querySelector('#w-eps');
    const eps=seasonData.episodes||[];
    const prev=episode>1;
    let nextHref=null;
    if(episode<eps.length)nextHref=`#/watch/tv/${id}/${season}/${episode+1}`;
    else{const i=seasons.findIndex(x=>x.season_number===season);const ns=seasons[i+1];if(ns)nextHref=`#/watch/tv/${id}/${ns.season_number}/1`}
    const renderEps=()=>{
      const pNow=Progress.get(id);
      epsEl.innerHTML=`<div class="eps-head"><h2>Episodes</h2>
        <select id="season-sel">${seasons.map(x=>`<option value="${x.season_number}" ${x.season_number===season?'selected':''}>${esc(x.name||'Season '+x.season_number)}</option>`).join('')}</select></div>
        <div class="eps">${eps.map(ep=>{
          const n=ep.episode_number;
          const pr=pNow?.show_progress?.[`s${season}e${n}`]?.progress;
          const pct=pr&&pr.duration>0?Math.min(100,Math.round((pr.watched||0)/pr.duration*100)):0;
          return`<a class="ep ${n===episode?'cur':''}" href="#/watch/tv/${id}/${season}/${n}">
            ${ep.still_path?`<img loading="lazy" src="${TMDB.img(ep.still_path,'w300')}" alt="">`:'<div class="ep-noimg"></div>'}
            <div class="ep-body"><div class="ep-n">E${n}${ep.runtime?` · ${ep.runtime}m`:''}</div><div class="ep-t">${esc(ep.name||'Episode '+n)}</div></div>
            ${pct?`<div class="epbar"><i style="width:${pct}%"></i></div>`:''}
          </a>`}).join('')}</div>
        <div class="epnav">${prev?`<a class="btn ghost sm" href="#/watch/tv/${id}/${season}/${episode-1}">← Prev</a>`:''}${nextHref?`<a class="btn ghost sm" href="${nextHref}">Next →</a>`:''}</div>`;
      epsEl.querySelector('#season-sel').onchange=e=>{location.hash=`#/watch/tv/${id}/${e.target.value}/1`};
    };
    renderEps();
    const onMsg=ev=>{
      if(ev.origin!==PEACHIFY_ORIGIN)return;
      const m=ev.data;if(!m||typeof m.type!=='string')return;
      if(m.type==='MEDIA_DATA'){Progress.merge(m.data);renderEps()}
    };
    window.addEventListener('message',onMsg);
    cleanup=()=>window.removeEventListener('message',onMsg);
  }
  tmdb(`/${type}/${id}/recommendations`).then(r=>{
    const row=rowEl('Recommended for you',r.results);if(row)c.querySelector('.rows').appendChild(row);
  }).catch(()=>{});
}

async function SearchView(q0){
  document.title='Search — PeachFlix';
  const c=el(`<div>
    <div class="search-wrap"><input id="q" type="search" placeholder="Search movies, series, people…" value="${esc(q0)}" autocomplete="off"></div>
    <div class="seg" id="s-tabs">
      <button class="on" data-tab="all">All</button><button data-tab="movie">Movies</button><button data-tab="tv">Series</button><button data-tab="person">People</button>
    </div>
    <div id="s-results"><p class="sub-h">Type at least 2 characters…</p></div>
  </div>`);
  commit(c);
  const input=c.querySelector('#q'),res=c.querySelector('#s-results'),tabs=c.querySelector('#s-tabs');
  let data=null,tab='all';
  const render=()=>{
    if(!data){res.innerHTML='<p class="sub-h">Type at least 2 characters…</p>';return}
    const r=data.results||[];
    const movies=r.filter(x=>x.media_type==='movie'),tvs=r.filter(x=>x.media_type==='tv'),people=r.filter(x=>x.media_type==='person');
    let html='';
    if(tab==='movie')html=movies.map(card).join('');
    else if(tab==='tv')html=tvs.map(card).join('');
    else if(tab==='person')html=people.map(personCard).join('');
    else html=[...movies,...tvs].map(card).join('')+people.map(personCard).join('');
    res.innerHTML=html?`<div class="grid">${html}</div>`:'<p class="sub-h">No results found.</p>';
  };
  const run=debounce(async q=>{
    if(!q||q.length<2){data=null;render();return}
    res.innerHTML=`<div class="grid">${'<div class="card"><div class="card-img sk"></div></div>'.repeat(9)}</div>`;
    try{data=await tmdb('/search/multi',{query:q,include_adult:'false'})}catch{data={results:[]}}
    render();
  },400);
  input.addEventListener('input',()=>run(input.value.trim()));
  tabs.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;tab=b.dataset.tab;tabs.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));render()});
  if(q0)run(q0);else if(window.innerWidth>899)setTimeout(()=>input.focus(),50);
}

/* ============================ group modal ============================ */
let groupItem=null;
function groupModal(item){
  groupItem=item;
  const g=Groups.all();
  const uids=Object.keys(g).sort((a,b)=>g[b].created-g[a].created);
  openModal(`<h3>Add “${esc(item.title)}” to a group</h3>
    <div class="glist">${uids.map(u=>`<label class="grow2"><input type="checkbox" data-uid="${u}" ${g[u].items.some(i=>String(i.id)===String(item.id)&&i.type===item.type)?'checked':''}><span>${esc(g[u].name)} <em class="muted">(${g[u].items.length})</em></span></label>`).join('')||'<p class="muted" style="font-size:14px">No groups yet — create one below.</p>'}</div>
    <div class="gnew"><input id="g-new" placeholder="New group name…" autocomplete="off"><button class="btn sm primary" data-action="g-create-in">Create</button></div>
    <div class="mrow"><button class="btn ghost" data-action="modal-close">Done</button></div>`);
}
document.getElementById('modal-root').addEventListener('change',e=>{
  const cb=e.target.closest('input[data-uid]');
  if(!cb||!groupItem)return;
  toast(Groups.toggle(cb.dataset.uid,groupItem)?'Added to group':'Removed from group');
});

/* ============================ global actions ============================ */
document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-action]');if(!t)return;
  const d=t.dataset;
  const item=()=>({id:d.id,type:d.type,title:d.title,poster:d.poster,year:d.year});
  switch(d.action){
    case'goto-settings':location.hash='#/settings';break;
    case'retry':route();break;
    case'cw-remove':Progress.remove(d.id);route();break;
    case'fav-toggle':{const on=Fav.toggle(item());t.classList.toggle('on',on);t.innerHTML=(on?'♥':'♡')+' Favorite';toast(on?'Added to Favorites':'Removed from Favorites');break}
    case'wl-toggle':{const on=WL.toggle(item());t.classList.toggle('on',on);t.innerHTML=(on?'✓':'＋')+' Watchlist';toast(on?'Added to Watchlist':'Removed from Watchlist');break}
    case'fav-remove':Fav.remove(d.type,d.id);route();break;
    case'wl-remove':WL.remove(d.type,d.id);route();break;
    case'group-item-remove':Groups.removeItem(d.uid,d.id,d.type);route();break;
    case'group-add':groupModal(item());break;
    case'g-create-in':{const inp=document.getElementById('g-new');const n=inp.value.trim();if(!n)return;const uid=Groups.create(n);Groups.toggle(uid,groupItem);groupModal(groupItem);break}
    case'group-new':nameModal('New group','',n=>{Groups.create(n);route()});break;
    case'group-rename':{const g=Groups.get(d.uid);if(g)nameModal('Rename group',g.name,n=>{Groups.rename(d.uid,n);route()});break}
    case'group-delete':confirmModal('Delete this group?',()=>{Groups.remove(d.uid);route()});break;
    case'share':share();break;
    case'trailer':openModal(`<div class="trailer"><iframe src="https://www.youtube.com/embed/${encodeURIComponent(d.key)}?autoplay=1&rel=0" allow="autoplay; fullscreen; encrypted-media" allowfullscreen title="Trailer"></iframe></div><div class="mrow"><button class="btn ghost" data-action="modal-close">Close</button></div>`);break;
    case'modal-close':closeModal();break;
    case'bio-more':{const b=t.closest('.bio-wrap').querySelector('.bio');b.classList.toggle('open');t.textContent=b.classList.contains('open')?'Show less':'Read more';break}
    case'onb-save':{const k=document.getElementById('onb-key').value.trim();if(k.length<20){toast("That doesn't look like a TMDB v3 key");return}Settings.set({tmdbKey:k});toast('Key saved 🎉');location.hash='#/';route();break}
    case'test-key':{try{await tmdb('/configuration');toast('Key works ✔')}catch(err){toast(err.message)}break}
    case'clear-cw':confirmModal('Clear continue-watching history?',()=>{Progress.clear();toast('Cleared');route()});break;
    case'clear-all':confirmModal('Erase ALL local data (favorites, groups, history, settings)?',()=>{['pf_settings','pf_favs','pf_watchlist','pf_groups','peachifyProgress'].forEach(k=>localStorage.removeItem(k));location.hash='#/';route()});break;
  }
});

/* ============================ router ============================ */
function setNav(parts){
  let key='home';
  if(parts[0]==='browse')key=parts[1]==='tv'?'series':'movies';
  else if(parts[0]==='movie')key='movies';
  else if(parts[0]==='tv')key='series';
  else if(parts[0]==='search')key='search';
  else if(['mine','list'].includes(parts[0]))key='mine';
  else if(['watch','settings','person','collection'].includes(parts[0]))key=null;
  document.querySelectorAll('[data-nav]').forEach(a=>a.classList.toggle('active',a.dataset.nav===key));
}
async function route(){
  ++routeId;
  if(cleanup){try{cleanup()}catch{}cleanup=null}
  const hash=(location.hash||'#/').slice(1);
  const[pathStr,qs]=hash.split('?');
  const q=new URLSearchParams(qs||'');
  const parts=pathStr.split('/').filter(Boolean);
  setNav(parts);
  window.scrollTo(0,0);
  try{
    if(!Settings.get().tmdbKey)return Onboarding();
    if(!parts.length)return await HomeView();
    switch(parts[0]){
      case'browse':return await BrowseView(parts[1]==='tv'?'tv':'movie',q);
      case'movie':case'tv':return parts[1]?await DetailView(parts[0],parts[1]):await HomeView();
      case'watch':return parts[2]?await WatchView(parts[1]==='tv'?'tv':'movie',parts[2],Math.max(1,parseInt(parts[3])||1),Math.max(1,parseInt(parts[4])||1)):await HomeView();
      case'search':return await SearchView(q.get('q')||'');
      case'mine':return MineView();
      case'list':return ListView(parts[1]);
      case'collection':return parts[1]?await CollectionView(parts[1]):await HomeView();
      case'person':return parts[1]?await PersonView(parts[1]):await HomeView();
      case'settings':return SettingsView();
      default:return await HomeView();
    }
  }catch(err){console.error(err);view.innerHTML=errorBox(err)}
}

/* ============================ boot ============================ */
applyAccent(Settings.get().accent);
window.addEventListener('hashchange',route);
route();
})();
